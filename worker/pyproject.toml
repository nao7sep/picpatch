[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "picpatch-worker"
version = "0.0.0"
description = "Internal image editing worker for PicPatch"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "Yoshinao Inoguchi", email = "yoshinao@inoguchi.com" }]
dependencies = [
    "jsonschema>=4.23,<5",
    "referencing>=0.37,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/picpatch_worker"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[project.optional-dependencies]
inference = ["mflux==0.22.0"]

# The inference extra is never installed by default; models are always supplied locally.

[tool.coverage.run]
data_file = "coverage/.coverage-python"
