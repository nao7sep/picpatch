[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "picpatch-dreamo-worker"
version = "0.0.0"
description = "Internal local DreamO image conditioning worker"
requires-python = ">=3.15,<3.16"
license = "GPL-3.0-or-later"
authors = [{ name = "Yoshinao Inoguchi", email = "yoshinao@inoguchi.com" }]
dependencies = ["jsonschema>=4.23,<5", "referencing>=0.37,<1", "packaging>=26.0"]

[project.optional-dependencies]
inference = [
  "torch==2.14.1", "torchvision==0.29.1", "diffusers==0.41.0",
  "transformers==5.20.1", "accelerate==1.15.0", "peft==0.21.2",
  "einops==0.8.2", "timm==1.0.30", "opencv-python==5.0.0.93",
  "numpy==2.5.4", "pillow==13.0.0", "safetensors==0.8.0", "sentencepiece==0.2.2", "protobuf==7.36.2",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/picpatch_dreamo"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }]
