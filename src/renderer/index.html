<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' picpatch-image: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>PicPatch</title><link rel="stylesheet" href="style.css"></head><body>
<header><button id="sessionsToggle">Sessions</button><input id="sessionName" aria-label="Session name"><button id="new">New session</button><span class="spacer"></span><button id="manage">Managed tools &amp; models</button><button id="save">Save image</button><button id="saveSettings">Save with settings</button><label><input type="checkbox" id="includePrompts"> Include prompts</label></header>
<div id="workspace">
<aside id="sessions" hidden><h2>Sessions</h2><div id="sessionList"></div><button id="collection">Open collection</button><button id="delete">Delete session</button></aside>
<section id="request"><div class="scroll"><label>Operation<select id="mode"><option value="generate">Generate</option><option value="edit">Edit</option></select></label><fieldset><legend>Models</legend><div id="modelList"></div></fieldset><label id="promptLabel">Prompt<textarea id="text" rows="6" placeholder="Describe the image you want"></textarea></label>
<div class="row"><label>Width<input id="width" type="number" min="1" step="16"></label><label>Height<input id="height" type="number" min="1" step="16"></label></div>
<div class="row"><label>Seed<input id="seed" type="number" min="0" placeholder="Random"></label><label>Samples<input id="samples" type="number" value="1" min="1" max="100"></label></div>
<div id="editControls"><button id="import">Add source image</button><button id="clearSource">Clear source</button><p id="sourceName"></p><button id="addReference">Add reference group</button><div id="references"></div><p id="maskSemantics"></p><div class="row"><button id="paint">Paint mask</button><button id="clearMask">Clear mask</button></div><label><input id="erase" type="checkbox"> Erase mask</label><label>Brush size<input id="brush" type="range" min="1" max="150" value="35"></label><button id="undoMask">Undo stroke</button><button id="redoMask">Redo stroke</button>
<details><summary>Expand canvas</summary><label><input type="checkbox" id="expand"> Enable expansion</label><div class="row"><label>Width<input id="outWidth" type="number" value="1280" min="1"></label><label>Height<input id="outHeight" type="number" value="1280" min="1"></label></div><div class="row"><label>Source left<input id="outLeft" type="number" value="128" min="0"></label><label>Source top<input id="outTop" type="number" value="128" min="0"></label></div></details></div>
<details><summary>Advanced settings</summary><div id="parameters"></div></details></div><div class="runActions"><button id="run" class="primary">Generate</button><button id="resume">Resume queued</button></div></section>
<main><div class="canvasToolbar"><button id="fit">Fit</button><button id="actual">100%</button><label>Zoom<input id="zoom" type="range" min="10" max="200" value="100"></label><button id="compare">Compare selected</button><button id="reuse">Reuse settings</button><button id="editResult">Edit this result</button></div><div id="canvas"><p id="empty">Generate an image or add a source to begin.</p><div id="imageStage"><img id="image" alt="Selected image"><canvas id="mask"></canvas></div><img id="comparison" alt="Comparison image" hidden></div><div id="resultInfo"></div><div id="results"></div></main>
</div><footer><span id="status">Ready</span><progress id="progress" hidden></progress><span class="spacer"></span><button id="cancel" hidden>Cancel</button></footer>
<div id="issue" role="alert" hidden><span></span><button aria-label="Clear message">Close</button></div>
<dialog id="management"><h2>Managed tools and models</h2><p>Engines and models are shared SDK resources. Sessions remain separate.</p><div class="row"><button id="checkEngines">Inspect engines</button><button id="installPython">Install Python engine</button><button id="installNative">Install native engine</button></div><p id="engineState"></p><label>Model<select id="manageModel"></select></label><div class="row"><button id="download">Download pinned model</button><button id="register">Register local bundle</button></div><div id="managedList"></div><p id="manageIssue" role="alert"></p><button id="closeManagement">Close</button></dialog>
<script type="module" src="renderer.js"></script></body></html>
