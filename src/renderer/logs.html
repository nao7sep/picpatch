<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PicPatch</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="logs.css"></head><body hidden><div id="logsViewport"><div id="logsFrame"><header id="logsFilters"><label><span data-i18n="logs.launch"></span><select id="launch"><option value="current" data-i18n="logs.currentLaunch"></option><option value="all" data-i18n="logs.allLaunches"></option></select></label><label><span data-i18n="logs.level"></span><select id="level"><option value="all" data-i18n="logs.allLevels"></option><option value="attention" data-i18n="logs.attention"></option><option value="error" data-i18n="logs.error"></option><option value="warn" data-i18n="logs.warn"></option><option value="info" data-i18n="logs.info"></option><option value="debug" data-i18n="logs.debug"></option></select></label><form id="searchForm"><label><span data-i18n="logs.search"></span><input id="search" type="search" maxlength="500"></label><button type="submit" id="refresh" data-i18n="logs.refresh"></button></form></header><p id="logsIssue" role="alert" hidden></p><div id="logsContent"><section id="logsListPane"><p id="logsStatus" role="status"></p><div id="logsList" role="listbox" tabindex="0" aria-label="" data-i18n-aria-label="ui.logs"></div><nav><button id="newest" data-i18n="logs.newest"></button><button id="older" data-i18n="logs.older" disabled></button></nav></section><section id="logsDetailPane"><h2 data-i18n="logs.detail"></h2><pre id="logsDetail" tabindex="0"></pre></section></div><footer><span data-i18n="logs.privacy"></span></footer></div></div><script type="module" src="logs.js"></script></body></html>
