[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "picpatch-worker"
version = "0.0.0"
description = "Internal image editing worker for PicPatch"
requires-python = ">=3.15,<3.16"
license = "GPL-3.0-or-later"
authors = [{ name = "Yoshinao Inoguchi", email = "yoshinao@inoguchi.com" }]
dependencies = [
    "jsonschema>=4.23,<5",
    "referencing>=0.37,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/picpatch_worker"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[project.optional-dependencies]
# Direct declaration lets uv route this MFLUX dependency to its official index.
inference = ["mflux==0.22.0", "torch>=2.13.0,<3.0"]

# The inference extra is never installed by default; models are always supplied locally.

[tool.coverage.run]
data_file = "coverage/.coverage-python"

# PyPI omits the macOS CPython 3.15 wheel shipped on PyTorch's official index.
# Keep other packages and interpreter/platform combinations on PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# The inference runtime is supported on Apple Silicon; Linux MLX has no cp315 wheel.
[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'darwin' and python_version >= '3.15'" }]
