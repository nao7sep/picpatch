name: Release

# Per the app-release-conventions: test → package → attach to a DRAFT release.
# CI stays minimal — the packaging complexity lives in electron-builder.yml and
# the `dist` npm script. Nothing is published automatically; a draft is created
# for the pushed tag, verified, then published by hand (gh release edit --draft=false).
#
# macOS (Apple Silicon) only: local inference runs on Metal, and the bundled uv
# that scripts/prepare-tools.mjs pins exists for darwin-arm64 alone.
#
# Two triggers:
#   - push a tag `v*` -> build, attach the dmg and portable zip to a draft release.
#   - manual dispatch -> build only (no release), for a smoke check.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Gate: a failing test suite means no release is built.
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: npm run check:release-tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      # The SDK's Python tests run through uv. The same pinned, checksum-verified
      # uv the app bundles is put on PATH, so CI needs no extra action.
      - name: Provide the pinned uv
        run: |
          npm run prepare:tools
          echo "$PWD/node_modules/.cache/picpatch-desktop/uv-0.13.1" >> "$GITHUB_PATH"
      # npm test is a fixed set, so it runs the same here as it does locally.
      # The live lane stays out of CI: npm run test:full is a local gate.
      - run: npm test

  build:
    needs: test
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci

      # One command: electron-vite build + bundled tools + electron-builder.
      # --publish never (in the script) means it builds but uploads nothing here.
      # CSC_IDENTITY_AUTO_DISCOVERY=false only blocks real-cert discovery; the ad-hoc
      # bundle seal comes from the mac `identity: "-"` in the builder config.
      - name: Package
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Attach only the real artifacts to the draft. The globs deliberately omit
      # electron-builder's auto-update byproducts (latest*.yml, *.blockmap).
      - name: Attach to draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          # A 0.x version number carries the early-release signal on its own; the
          # draft flag is what protects the release until it is published by hand.
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            **PicPatch ${{ github.ref_name }}** for Apple Silicon Macs

            This build is unsigned, so macOS warns on first launch: right-click the app → **Open** (or `xattr -dr com.apple.quarantine PicPatch.app`).
          files: |
            dist/*.dmg
            dist/*.zip
