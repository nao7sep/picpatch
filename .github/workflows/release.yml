name: Release

# Test, then package, then attach to a DRAFT release, so a failing suite never ships.
# CI stays minimal — the packaging complexity lives in electron-builder.yml and
# the `dist` npm script. Nothing is published automatically; a draft is created
# for the pushed tag, verified, then published by hand (gh release edit --draft=false).
#
# macOS (Apple Silicon) runs every engine; Windows (x64) runs the native engine only.
# The SDK's Python tests need uv's macOS-only lockfiles, so Windows runs the Node suites.
#
# Two triggers:
#   - push a tag `v*` -> build both platforms, attach installers and portables to one draft release.
#   - manual dispatch -> build only (no release), for a smoke check.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Gate: a failing test suite means no release is built.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      # The npm version comes from packageManager in package.json, its one source.
      - run: npm install --global "$(node -p "require('./package.json').packageManager")"
        shell: bash
      - run: npm ci
      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: npm run check:release-tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      # The SDK's Python tests run through uv. The same pinned, checksum-verified
      # uv the app bundles is put on PATH, so CI needs no extra action.
      - name: Provide the pinned uv
        if: runner.os == 'macOS'
        run: |
          npm run prepare:tools
          echo "$PWD/node_modules/.cache/picpatch-desktop/uv" >> "$GITHUB_PATH"
      # npm test is a fixed set, so it runs the same here as it does locally.
      # The live lane stays out of CI: npm run test:full is a local gate.
      - run: npm test
        if: runner.os == 'macOS'
      - run: npm run test:node
        if: runner.os == 'Windows'

  build:
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false # a Windows failure never cancels the macOS build
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      # The npm version comes from packageManager in package.json, its one source.
      - run: npm install --global "$(node -p "require('./package.json').packageManager")"
        shell: bash
      - run: npm ci

      # One command: electron-vite build + bundled tools + electron-builder.
      # --publish never (in the script) means it builds but uploads nothing here.
      # CSC_IDENTITY_AUTO_DISCOVERY=false only blocks real-cert discovery; the ad-hoc
      # bundle seal comes from the mac `identity: "-"` in the builder config.
      - name: Package
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Attach only the real artifacts to the draft. The globs deliberately omit
      # electron-builder's auto-update byproducts (latest*.yml, *.blockmap).
      - name: Attach to draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          # A 0.x version number carries the early-release signal on its own; the
          # draft flag is what protects the release until it is published by hand.
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            **PicPatch ${{ github.ref_name }}** for Apple Silicon Macs and 64-bit Windows

            These builds are unsigned, so the OS warns on first launch:
            - **macOS**: right-click the app → **Open** (or `xattr -dr com.apple.quarantine PicPatch.app`)
            - **Windows**: SmartScreen → **More info** → **Run anyway**
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
